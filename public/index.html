<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INFOBAY — Tech & Security Aggregator</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: {
            royalblue: {
              50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 500: '#3b82f6',
              600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a', 950: '#0f172a'
            },
            darkbg: '#090d16', darkcard: '#111827', darkborder: '#1e293b'
          },
          animation: { 'marquee': 'marquee 38s linear infinite' },
          keyframes: { marquee: { '0%': { transform: 'translateX(0%)' }, '100%': { transform: 'translateX(-50%)' } } }
        }
      }
    }
  </script>
  <style>
    .marquee-container:hover .marquee-content { animation-play-state: paused; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-darkbg text-slate-900 dark:text-slate-100 min-h-screen font-sans antialiased transition-colors duration-200">
  <div id="app" class="flex flex-col min-h-screen">

    <!-- Top Status Bar -->
    <div class="bg-royalblue-950 text-xs py-2 px-4 sm:px-8 flex justify-between items-center text-slate-100 border-b border-royalblue-900 shadow-sm">
      <div class="flex items-center space-x-2">
        <i class="fa-regular fa-calendar-check text-royalblue-400"></i>
        <span class="font-semibold tracking-wide">{{ currentDate }}</span>
      </div>
      <div class="flex items-center space-x-2 font-mono text-slate-100 bg-royalblue-900/60 px-2.5 py-0.5 rounded-md border border-royalblue-800/80">
        <i class="fa-regular fa-clock text-royalblue-400"></i>
        <span class="font-semibold">{{ currentTime }}</span>
      </div>
    </div>

    <!-- Navigation Header -->
    <header class="sticky top-0 z-50 bg-white/95 dark:bg-darkcard/95 backdrop-blur-md border-b border-slate-300 dark:border-darkborder transition-colors shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col md:flex-row items-center justify-between gap-4">
        
        <div class="flex items-center">
          <h1 @click="selectedSource = 'ALL'; searchQuery = '';" class="text-3xl sm:text-4xl font-black tracking-tight text-royalblue-700 dark:text-royalblue-400 cursor-pointer select-none">
            INFOBAY
          </h1>
        </div>

        <div class="flex items-center space-x-2 sm:space-x-3 w-full md:w-auto">
          <div class="relative flex-grow md:w-64">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 dark:text-slate-400 text-xs"></i>
            <input type="text" v-model="searchQuery" placeholder="Search news..." class="w-full pl-9 pr-3 py-2 bg-slate-200/80 dark:bg-slate-900/80 border border-slate-300 dark:border-darkborder rounded-xl focus:outline-none focus:ring-2 focus:ring-royalblue-600 text-xs font-medium text-slate-900 dark:text-white transition-all">
          </div>

          <select v-model="selectedSource" class="bg-slate-200/80 dark:bg-slate-900/80 text-slate-800 dark:text-slate-200 border border-slate-300 dark:border-darkborder rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-royalblue-600 cursor-pointer transition-all">
            <option value="ALL">All Sources</option>
            <option v-for="source in sources" :key="source" :value="source">{{ source }}</option>
          </select>

          <div class="flex items-center bg-slate-200/80 dark:bg-slate-900/80 border border-slate-300 dark:border-darkborder rounded-xl p-0.5">
            <button @click="viewMode = 'grid'" :class="viewMode === 'grid' ? 'bg-royalblue-700 text-white shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-royalblue-600'" class="p-2 rounded-lg text-xs transition-all">
              <i class="fa-solid fa-grip-vertical"></i>
            </button>
            <button @click="viewMode = 'list'" :class="viewMode === 'list' ? 'bg-royalblue-700 text-white shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-royalblue-600'" class="p-2 rounded-lg text-xs transition-all">
              <i class="fa-solid fa-list-ul"></i>
            </button>
          </div>

          <button @click="fetchFeeds" :disabled="loading" class="p-2.5 text-slate-700 dark:text-slate-200 hover:text-royalblue-700 dark:hover:text-white bg-slate-200/80 dark:bg-slate-900/80 border border-slate-300 dark:border-darkborder rounded-xl transition-all disabled:opacity-50">
            <i class="fa-solid fa-arrows-rotate text-xs" :class="{ 'fa-spin': loading }"></i>
          </button>

          <button @click="toggleTheme" class="p-2.5 text-slate-700 dark:text-slate-200 bg-slate-200/80 dark:bg-slate-900/80 border border-slate-300 dark:border-darkborder rounded-xl transition-all">
            <i class="fa-solid text-xs" :class="isDark ? 'fa-sun' : 'fa-moon'"></i>
          </button>
        </div>

      </div>
    </header>

    <!-- Marquee -->
    <section class="bg-royalblue-900 text-white border-b border-royalblue-950 overflow-hidden py-2 marquee-container relative shadow-inner">
      <div class="flex items-center">
        <div class="z-10 bg-royalblue-600 px-3 py-1 ml-4 text-[11px] font-black uppercase tracking-wider rounded shadow flex items-center gap-2 shrink-0">
          <span class="w-2 h-2 rounded-full bg-red-400 animate-ping"></span> Headline
        </div>
        
        <div class="flex overflow-hidden w-full whitespace-nowrap">
          <div class="inline-flex animate-marquee marquee-content items-center space-x-8 text-xs font-semibold text-slate-100 pl-4">
            <span v-for="(item, idx) in marqueeArticles" :key="'m1-' + idx" class="inline-flex items-center">
              <a :href="item.link" target="_blank" class="hover:underline flex items-center gap-2">
                <span class="text-royalblue-300 font-bold">[{{ item.source }}]</span>
                <span>{{ item.title }}</span>
              </a>
              <span class="ml-8 text-royalblue-500">✦</span>
            </span>
          </div>
        </div>
      </div>
    </section>

    <!-- Main Section -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-8">
          <div v-if="loading" class="space-y-8 animate-pulse">
            <div class="h-80 bg-slate-300 dark:bg-darkcard rounded-3xl"></div>
          </div>

          <template v-else-if="uniqueArticles.length > 0">
            <!-- Top Story -->
            <section v-if="topStory" class="mb-8">
              <div class="group relative bg-white dark:bg-darkcard border border-slate-300 dark:border-darkborder rounded-3xl overflow-hidden shadow-lg flex flex-col">
                <div class="h-64 sm:h-80 relative overflow-hidden bg-slate-800">
                  <img :src="topStory.uniqueImage" :alt="topStory.title" @error="e => onImageError(e, topStory)" class="w-full h-full object-cover">
                  <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent"></div>
                  <div class="absolute top-4 left-4">
                    <span class="px-3 py-1.5 text-xs font-black rounded-lg bg-royalblue-700 text-white uppercase">Top Story — {{ topStory.source }}</span>
                  </div>
                </div>
                <div class="p-6 sm:p-8">
                  <div class="text-xs font-bold text-royalblue-700 dark:text-royalblue-400 mb-3"><i class="fa-regular fa-clock"></i> {{ formatDate(topStory.pubDate) }}</div>
                  <h2 class="text-xl sm:text-2xl font-black text-slate-900 dark:text-white mb-4">{{ topStory.title }}</h2>
                  <p class="text-xs sm:text-sm text-slate-700 dark:text-slate-300 mb-6 font-medium">{{ topStory.snippet }}</p>
                  <a :href="topStory.link" target="_blank" class="px-6 py-3 bg-royalblue-700 text-white text-xs font-bold rounded-xl inline-block">Read Full Story</a>
                </div>
              </div>
            </section>

            <!-- Articles Feed -->
            <div v-if="viewMode === 'grid'" class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <article v-for="(item, index) in remainingArticles" :key="'grid-' + index" class="bg-white dark:bg-darkcard border border-slate-300 dark:border-darkborder rounded-2xl overflow-hidden shadow-sm flex flex-col">
                <div class="relative h-48 bg-slate-800">
                  <img :src="item.uniqueImage" :alt="item.title" @error="e => onImageError(e, item)" class="w-full h-full object-cover">
                  <div class="absolute top-3 left-3"><span class="px-2.5 py-1 text-xs font-extrabold rounded-lg bg-royalblue-950/90 text-white">{{ item.source }}</span></div>
                </div>
                <div class="p-5 flex flex-col flex-grow">
                  <div class="text-xs text-slate-600 dark:text-slate-400 mb-2 font-bold"><i class="fa-regular fa-clock"></i> {{ formatDate(item.pubDate) }}</div>
                  <h3 class="text-base font-bold text-slate-900 dark:text-white mb-2 leading-snug">{{ item.title }}</h3>
                  <p class="text-xs text-slate-700 dark:text-slate-300 mb-4 flex-grow font-medium">{{ item.snippet }}</p>
                  <a :href="item.link" target="_blank" class="text-xs font-bold text-royalblue-700 dark:text-royalblue-400">Read full story <i class="fa-solid fa-arrow-up-right-from-square ml-1"></i></a>
                </div>
              </article>
            </div>
          </template>
        </div>

        <!-- Right CVE Sidebar -->
        <aside class="lg:col-span-4 space-y-6">
          <div class="bg-white dark:bg-darkcard border border-slate-300 dark:border-darkborder rounded-2xl p-5 shadow-sm sticky top-24">
            <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-200 dark:border-darkborder">
              <h3 class="text-sm font-black uppercase tracking-wider">Live CVE Tracker</h3>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-red-100 text-red-700">REAL-TIME THREATS</span>
            </div>
            <div class="space-y-3.5 max-h-[700px] overflow-y-auto pr-1">
              <div v-for="cve in liveThreats" :key="cve.id" class="p-3.5 rounded-xl border bg-slate-50 dark:bg-slate-900/60 border-slate-200 dark:border-darkborder">
                <div class="flex items-center justify-between mb-2">
                  <span class="font-mono text-xs font-bold text-royalblue-700 dark:text-royalblue-400">{{ cve.id }}</span>
                  <span :class="getSeverityBadgeClass(cve.severity)" class="text-[9px] font-black px-2 py-0.5 rounded uppercase">{{ cve.severity }}</span>
                </div>
                <h4 class="text-xs font-bold mb-1.5">{{ cve.title }}</h4>
                <p class="text-[11px] text-slate-600 dark:text-slate-400 mb-2.5 font-medium">{{ cve.summary }}</p>
                <a :href="cve.link" target="_blank" class="text-[10px] text-royalblue-600 font-bold">Details <i class="fa-solid fa-angle-right"></i></a>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <footer class="border-t border-slate-300 dark:border-darkborder bg-white dark:bg-darkcard py-6">
      <div class="max-w-7xl mx-auto px-4 text-center text-xs font-semibold text-slate-600 dark:text-slate-400">
        INFOBAY &copy; {{ currentYear }} — Real-Time Tech & Cybersecurity Intelligence Aggregator
      </div>
    </footer>
  </div>

  <script>
    const { createApp, ref, computed, onMounted, onUnmounted } = Vue;

    createApp({
      setup() {
        const articles = ref([]);
        const loading = ref(true);
        const searchQuery = ref('');
        const selectedSource = ref('ALL');
        const viewMode = ref('grid');
        const isDark = ref(false);
        const currentDate = ref('');
        const currentTime = ref('');
        const currentYear = new Date().getFullYear();

        const feedList = [
          { name: 'TechCrunch', url: 'https://techcrunch.com/feed/' },
          { name: 'The Verge', url: 'https://www.theverge.com/rss/index.xml' },
          { name: 'Ars Technica', url: 'https://feeds.arstechnica.com/arstechnica/index' },
          { name: 'Hacker News', url: 'https://news.ycombinator.com/rss' },
          { name: 'WIRED', url: 'https://www.wired.com/feed/rss' },
          { name: 'Krebs Security', url: 'https://krebsonsecurity.com/feed/' }
        ];

        const sources = feedList.map(f => f.name);

        const liveThreats = ref([
          { id: 'CVE-2026-2819', title: 'Linux Kernel Remote Code Execution in eBPF', severity: 'CRITICAL', summary: 'Out-of-bounds write vulnerability allows unauthenticated remote code execution.', link: 'https://nvd.nist.gov' },
          { id: 'CVE-2026-1044', title: 'Cisco IOS XE Web UI Authentication Bypass', severity: 'CRITICAL', summary: 'Privilege escalation flaw allows creating admin accounts on networking hardware.', link: 'https://nvd.nist.gov' },
          { id: 'CVE-2026-3392', title: 'Windows NTLM Relay Authentication Vulnerability', severity: 'HIGH', summary: 'Validation flaw in NTLM protocol enables active directory credential relaying.', link: 'https://nvd.nist.gov' }
        ]);

        const getSeverityBadgeClass = (sev) => sev === 'CRITICAL' ? 'bg-red-500 text-white' : 'bg-amber-500 text-white';

        const fetchFeeds = async () => {
          loading.value = true;
          let loaded = [];

          for (const feed of feedList) {
            try {
              const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(feed.url)}`;
              const res = await fetch(proxyUrl);
              const data = await res.json();
              
              if (data.contents) {
                const parser = new DOMParser();
                const xml = parser.parseFromString(data.contents, "text/xml");
                const items = xml.querySelectorAll("item, entry");
                
                let count = 0;
                items.forEach(item => {
                  if (count >= 5) return;
                  const title = item.querySelector("title")?.textContent || '';
                  const link = item.querySelector("link")?.textContent || item.querySelector("link")?.getAttribute("href") || '';
                  const pubDate = item.querySelector("pubDate, published, updated")?.textContent || new Date().toISOString();
                  const desc = item.querySelector("description, content, summary")?.textContent || '';
                  
                  const cleanDesc = desc.replace(/<[^>]*>?/gm, '').substring(0, 150) + '...';

                  if (title && link) {
                    loaded.push({
                      title: title.trim(),
                      link: link.trim(),
                      pubDate: pubDate,
                      snippet: cleanDesc,
                      source: feed.name,
                      uniqueImage: 'https://images.unsplash.com/photo-1488590528505-98d2b5aba04b?auto=format&fit=crop&w=800&q=80',
                      timestamp: new Date(pubDate).getTime() || Date.now()
                    });
                    count++;
                  }
                });
              }
            } catch (err) {
              console.error(`Error loading ${feed.name}:`, err);
            }
          }

          loaded.sort((a, b) => b.timestamp - a.timestamp);
          articles.value = loaded;
          loading.value = false;
        };

        const toggleTheme = () => {
          isDark.value = !isDark.value;
          document.documentElement.classList.toggle('dark', isDark.value);
        };

        const formatDate = (str) => str ? new Date(str).toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

        const uniqueArticles = computed(() => {
          return articles.value.filter(item => {
            const matchesSource = selectedSource.value === 'ALL' || item.source === selectedSource.value;
            const matchesQuery = item.title.toLowerCase().includes(searchQuery.value.toLowerCase());
            return matchesSource && matchesQuery;
          });
        });

        const topStory = computed(() => uniqueArticles.value[0] || null);
        const remainingArticles = computed(() => uniqueArticles.value.slice(1));
        const marqueeArticles = computed(() => articles.value.slice(0, 10));

        onMounted(() => {
          currentDate.value = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
          currentTime.value = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
          fetchFeeds();
        });

        return {
          articles, loading, searchQuery, selectedSource, sources, viewMode, isDark,
          currentDate, currentTime, currentYear, liveThreats, getSeverityBadgeClass,
          toggleTheme, fetchFeeds, formatDate, uniqueArticles, topStory, remainingArticles, marqueeArticles
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
